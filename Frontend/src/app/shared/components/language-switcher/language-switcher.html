<div class="language-switcher-dropdown position-relative d-inline-block">
  <button type="button" 
          class="btn btn-sm btn-alt-secondary lang-toggle-btn d-flex align-items-center gap-1.5 px-2.5 py-1.5 rounded-2"
          [class.active]="isOpen()"
          (click)="toggleDropdown($event)">
    <span class="lang-text fw-bold fs-xs text-uppercase">{{ currentLanguageShort }}</span>
    <i class="fa fa-fw fs-3xs opacity-60" [ngClass]="isOpen() ? 'fa-chevron-up' : 'fa-chevron-down'"></i>
  </button>

  <div class="dropdown-menu dropdown-menu-end shadow-lg border-0 py-1 mt-1 show animate__animated animate__fadeIn" 
       *ngIf="isOpen()"
       style="position: absolute; right: 0; top: 100%; z-index: 1060; min-width: 140px; border-radius: 8px;">
    <button type="button" 
            class="dropdown-item d-flex align-items-center justify-content-between py-2 px-3 fs-sm"
            *ngFor="let lang of languages"
            [class.active-lang]="translationService.currentLang() === lang.code"
            (click)="selectLanguage(lang.code, $event)">
      <span class="d-flex align-items-center gap-2">
        <span class="fs-xs">{{ lang.flag }}</span>
        <span class="fw-medium text-dark">{{ lang.label }}</span>
      </span>
      <i class="fa fa-check text-primary fs-xs ms-2" *ngIf="translationService.currentLang() === lang.code"></i>
    </button>
  </div>
</div>

<div class="modal fade show d-block modal-backdrop-container animate__animated animate__fadeIn"
     tabindex="-1"
     *ngIf="isOpen"
     (click)="onBackdropClick($event)">
  <div class="modal-dialog modal-dialog-centered" [style.maxWidth]="maxWidth">
    <div class="modal-content luxury-modal-content">
      
      <!-- Luxury Header -->
      <div class="luxury-modal-header d-flex align-items-center justify-content-between">
        <div class="d-flex align-items-center gap-2.5">
          <div class="rounded-circle bg-primary-subtle text-primary p-2 d-flex align-items-center justify-content-center flex-shrink-0" 
               style="width: 38px; height: 38px;">
            <i class="fa {{ icon }}"></i>
          </div>
          <div>
            <div class="d-flex align-items-center flex-wrap gap-2">
              <h4 class="modal-title fw-bold text-dark mb-0">
                {{ title }}
              </h4>
              <span class="badge {{ badgeClass }}" *ngIf="badgeText">
                <i class="fa {{ badgeIcon }} me-1" *ngIf="badgeIcon"></i> {{ badgeText }}
              </span>
            </div>
          </div>
        </div>
        <button type="button" class="btn-close" (click)="close.emit()"></button>
      </div>

      <!-- Luxury Body Slot -->
      <div class="modal-body p-4 bg-light">
        <ng-content select="[modal-body]"></ng-content>
      </div>

      <!-- Luxury Footer Slot -->
      <div class="luxury-modal-footer">
        <ng-content select="[modal-footer]"></ng-content>
      </div>

    </div>
  </div>
</div>

<div class="client-login-container">
  <div class="login-card">
    <div class="logo-area">
      <h1>{{ 'AUTH.CLIENT_PORTAL_TITLE' | translate }}</h1>
      <p class="subtitle">{{ 'AUTH.CLIENT_PORTAL_SUBTITLE' | translate }}</p>
    </div>

    <form (ngSubmit)="login()">
      <div class="form-group">
        <label for="token">{{ 'AUTH.ACCESS_TOKEN_LABEL' | translate }}</label>
        <input 
          type="text" 
          id="token" 
          name="token" 
          [ngModel]="accessLinkToken()" 
          (ngModelChange)="accessLinkToken.set($event)"
          [placeholder]="'AUTH.ACCESS_TOKEN_PH' | translate" 
          class="form-control"
          [disabled]="isLoading()"
          required
        >
      </div>

      <div *ngIf="errorMessage()" class="alert mb-3" [ngClass]="isExpired() ? 'alert-warning' : 'alert-danger'" style="border-radius: 12px; font-size: 0.85rem; line-height: 1.4;">
        <div class="d-flex align-items-start gap-2">
          <i class="fa mt-1" [ngClass]="isExpired() ? 'fa-lock text-warning fs-5' : 'fa-circle-exclamation text-danger fs-5'"></i>
          <div>
            <strong *ngIf="isExpired()" class="d-block mb-1">{{ 'AUTH.EXPIRED_ACCESS_TITLE' | translate }}</strong>
            {{ errorMessage() }}
          </div>
        </div>
      </div>

      <button type="submit" class="btn btn-primary w-100" [disabled]="isLoading() || !accessLinkToken()">
        <span *ngIf="isLoading()" class="spinner"></span>
        <span *ngIf="!isLoading()">{{ 'AUTH.SIGN_IN_BTN' | translate }}</span>
      </button>
    </form>
    
    <div class="footer-links">
      <p>{{ 'AUTH.ARE_YOU_ORGANIZER' | translate }} <a routerLink="/login">{{ 'AUTH.ORGANIZER_SIGNIN_LINK' | translate }}</a></p>
    </div>
  </div>
</div>

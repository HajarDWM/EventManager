<div class="client-login-container">
  <div class="login-card">
    <div class="logo-area">
      <h1>Portail Client</h1>
      <p class="subtitle">Accédez à la gestion de votre événement</p>
    </div>

    <form (ngSubmit)="login()">
      <div class="form-group">
        <label for="token">Jeton d'accès (Access Token)</label>
        <input 
          type="text" 
          id="token" 
          name="token" 
          [ngModel]="accessLinkToken()" 
          (ngModelChange)="accessLinkToken.set($event)"
          placeholder="Ex: a1b2c3d4..." 
          class="form-control"
          [disabled]="isLoading()"
          required
        >
      </div>

      <div *ngIf="errorMessage()" class="alert mb-3" [ngClass]="isExpired() ? 'alert-warning' : 'alert-danger'" style="border-radius: 12px; font-size: 0.85rem; line-height: 1.4;">
        <div class="d-flex align-items-start gap-2">
          <i class="fa mt-1" [ngClass]="isExpired() ? 'fa-lock text-warning fs-5' : 'fa-circle-exclamation text-danger fs-5'"></i>
          <div>
            <strong *ngIf="isExpired()" class="d-block mb-1">Accès Expiré</strong>
            {{ errorMessage() }}
          </div>
        </div>
      </div>

      <button type="submit" class="btn btn-primary w-100" [disabled]="isLoading() || !accessLinkToken()">
        <span *ngIf="isLoading()" class="spinner"></span>
        <span *ngIf="!isLoading()">Se Connecter</span>
      </button>
    </form>
    
    <div class="footer-links">
      <p>Vous êtes traiteur ? <a routerLink="/login">Connexion Traiteur</a></p>
    </div>
  </div>
</div>

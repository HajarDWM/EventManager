<div class="hero-static d-flex align-items-center bg-body-extra-light">
  <div class="content">
    <div class="row justify-content-center push">
      <div class="col-md-8 col-lg-6 col-xl-5">
        <!-- Sign Up Block -->
        <div class="block block-rounded mb-0 shadow-sm border border-light">
          <div class="block-header block-header-default bg-body-light border-bottom border-light">
            <h3 class="block-title">{{ 'AUTH.REGISTER_TITLE' | translate }}</h3>
            <div class="block-options">
              <a class="btn-block-option" routerLink="/login" [attr.title]="'AUTH.ALREADY_HAVE_ACCOUNT' | translate">
                <i class="fa fa-sign-in-alt"></i> {{ 'AUTH.SIGN_IN_BTN' | translate }}
              </a>
            </div>
          </div>
          <div class="block-content">
            <div class="p-sm-3 px-lg-4 py-lg-4">
              <h1 class="h2 mb-1 text-center">Event<span class="text-primary">Manager</span></h1>
              <p class="fw-medium text-muted text-center mb-4">
                {{ 'AUTH.REGISTER_SUBTITLE' | translate }}
              </p>

              <!-- Success Alert -->
              <div class="alert alert-success d-flex align-items-center gap-2" role="alert" *ngIf="successMessage()">
                <i class="fa fa-check-circle"></i>
                <div class="fs-sm fw-medium">{{ successMessage() }}</div>
              </div>

              <!-- Error Alert -->
              <div class="alert alert-danger d-flex align-items-center gap-2" role="alert" *ngIf="errorMessage() && !successMessage()">
                <i class="fa fa-exclamation-circle"></i>
                <div class="fs-sm fw-medium">{{ errorMessage() }}</div>
              </div>

              <!-- Sign Up Form -->
              <form (ngSubmit)="onSubmit()" *ngIf="!successMessage()">
                <div class="py-2">
                  <div class="mb-4">
                    <label class="form-label fs-sm fw-semibold" for="register-business">{{ 'AUTH.BUSINESS_NAME_LABEL' | translate }}</label>
                    <input type="text" class="form-control form-control-alt form-control-lg fs-sm"
                           id="register-business" name="register-business" [placeholder]="'AUTH.BUSINESS_NAME_PH' | translate"
                           [ngModel]="businessName()" (ngModelChange)="businessName.set($event)" required>
                  </div>
                  <div class="mb-4">
                    <label class="form-label fs-sm fw-semibold" for="register-email">{{ 'AUTH.EMAIL_LABEL' | translate }}</label>
                    <input type="email" class="form-control form-control-alt form-control-lg fs-sm"
                           id="register-email" name="register-email" placeholder="caterer@example.com"
                           [ngModel]="email()" (ngModelChange)="email.set($event)" required>
                  </div>
                  <div class="mb-4">
                    <label class="form-label fs-sm fw-semibold" for="register-password">{{ 'AUTH.PASSWORD_LABEL' | translate }}</label>
                    <input type="password" class="form-control form-control-alt form-control-lg fs-sm"
                           id="register-password" name="register-password" placeholder="••••••••"
                           [ngModel]="password()" (ngModelChange)="password.set($event)" required>
                  </div>
                </div>
                
                <div class="row mb-4">
                  <div class="col-12">
                    <button type="submit" class="btn w-100 btn-alt-success py-2" [disabled]="isLoading()">
                      <span *ngIf="!isLoading()">
                        <i class="fa fa-fw fa-user-plus me-1 opacity-50"></i> {{ 'AUTH.SIGN_UP_BTN' | translate }}
                      </span>
                      <span *ngIf="isLoading()">
                        <i class="fa fa-fw fa-circle-notch fa-spin me-1"></i> {{ 'AUTH.CREATING_ACCOUNT' | translate }}
                      </span>
                    </button>
                  </div>
                </div>
              </form>
              <!-- END Sign Up Form -->
            </div>
          </div>
        </div>
        <!-- END Sign Up Block -->
      </div>
    </div>
    <div class="fs-sm text-muted text-center mt-3">
      <strong>EventManager</strong> &copy; 2026
    </div>
  </div>
</div>

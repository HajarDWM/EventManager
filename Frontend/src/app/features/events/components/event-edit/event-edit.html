<!-- Hero -->
<div class="d-flex flex-column flex-md-row justify-content-md-between align-items-md-center py-2 text-center text-md-start">
  <div class="flex-grow-1 mb-1 mb-md-0">
    <h1 class="h3 fw-bold mb-2">
      Modifier l'événement
    </h1>
    <h2 class="h6 fw-medium text-muted mb-0">
      Mettez à jour les détails de cette prestation.
    </h2>
  </div>
</div>
<!-- END Hero -->

<div class="row mt-3">
  <div class="col-md-8 col-lg-6">
    <div class="block block-rounded shadow-sm border border-light">
      <div class="block-header block-header-default bg-body-light border-bottom border-light">
        <h3 class="block-title">Édition de la prestation #{{ eventId() }}</h3>
      </div>
      <div class="block-content">
        <!-- Error Alert -->
        <div class="alert alert-danger d-flex align-items-center gap-2" role="alert" *ngIf="errorMessage()">
          <i class="fa fa-exclamation-circle"></i>
          <div class="fs-sm fw-medium">{{ errorMessage() }}</div>
        </div>

        <!-- Loading Spinner -->
        <div class="text-center py-5" *ngIf="isLoading()">
          <i class="fa fa-fw fa-circle-notch fa-spin text-primary fs-2"></i>
          <p class="mt-2 text-muted fs-sm">Chargement des données de l'événement...</p>
        </div>

        <form (ngSubmit)="onSubmit()" *ngIf="!isLoading()">
          <!-- Titre -->
          <div class="mb-4">
            <label class="form-label fs-sm fw-semibold" for="event-title">Nom de l'événement <span class="text-danger">*</span></label>
            <input type="text" class="form-control form-control-alt fs-sm"
                   id="event-title" name="event-title" placeholder="Ex: Mariage de Sarah & Marc"
                   [ngModel]="title()" (ngModelChange)="title.set($event)" required>
          </div>

          <!-- Date & Heure -->
          <div class="mb-4">
            <label class="form-label fs-sm fw-semibold" for="event-date">Date & Heure <span class="text-danger">*</span></label>
            <input type="datetime-local" class="form-control form-control-alt fs-sm"
                   id="event-date" name="event-date"
                   [ngModel]="eventDate()" (ngModelChange)="eventDate.set($event)" required>
          </div>

          <!-- Lieu -->
          <div class="mb-4">
            <label class="form-label fs-sm fw-semibold" for="event-location">Lieu <span class="text-danger">*</span></label>
            <input type="text" class="form-control form-control-alt fs-sm"
                   id="event-location" name="event-location" placeholder="Ex: Château de Versailles, Galerie des Glaces"
                   [ngModel]="location()" (ngModelChange)="location.set($event)" required>
          </div>

          <!-- Nombre d'invités -->
          <div class="mb-4">
            <label class="form-label fs-sm fw-semibold" for="event-guests">Nombre d'invités attendus <span class="text-danger">*</span></label>
            <input type="number" class="form-control form-control-alt fs-sm"
                   id="event-guests" name="event-guests" placeholder="Ex: 150" min="1"
                   [ngModel]="guestCount()" (ngModelChange)="guestCount.set($event)" required>
          </div>

          <!-- Statut -->
          <div class="mb-4">
            <label class="form-label fs-sm fw-semibold" for="event-status">Statut de la prestation</label>
            <select class="form-select form-control-alt fs-sm"
                    id="event-status" name="event-status"
                    [ngModel]="status()" (ngModelChange)="status.set($event)">
              <option value="PLANNED">Planifié</option>
              <option value="DRAFT">Brouillon</option>
              <option value="COMPLETED">Terminé</option>
              <option value="CANCELLED">Annulé</option>
            </select>
          </div>

          <!-- Actions -->
          <div class="mb-4 d-flex gap-2">
            <button type="submit" class="btn btn-primary fs-sm px-4" [disabled]="isSaving()">
              <span *ngIf="!isSaving()">
                <i class="fa fa-save me-1"></i> Mettre à jour
              </span>
              <span *ngIf="isSaving()">
                <i class="fa fa-circle-notch fa-spin me-1"></i> Mise à jour...
              </span>
            </button>
            <a class="btn btn-alt-secondary fs-sm px-4" routerLink="/events">
              Annuler
            </a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

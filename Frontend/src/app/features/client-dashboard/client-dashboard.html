<div class="dashboard-header">
  <h2>Vos Événements</h2>
  <p>Sélectionnez un événement pour gérer la liste des invités</p>
</div>

<div class="events-grid" *ngIf="events().length > 0">
  <div class="event-card" *ngFor="let event of events()">
    <div class="event-card-content">
      <div class="event-icon">
        <i class="fas fa-calendar-alt"></i>
      </div>
      <div class="event-details">
        <h3>{{ event.title }}</h3>
        <p class="date"><i class="far fa-calendar"></i> {{ event.eventDate | date:'mediumDate' }}</p>
        <p class="location"><i class="fas fa-map-marker-alt"></i> {{ event.location }}</p>
      </div>
    </div>
    <div class="event-card-actions">
      <a [routerLink]="['/client/events', event.id, 'guests']" class="btn btn-outline mb-2">
        Gérer les invités <i class="fas fa-users"></i>
      </a>
      <a [routerLink]="['/client/events', event.id, 'menu']" class="btn btn-outline">
        Voir le menu <i class="fas fa-utensils"></i>
      </a>
    </div>
  </div>
</div>

<div class="empty-state" *ngIf="events().length === 0">
  <div class="empty-icon">
    <i class="far fa-folder-open"></i>
  </div>
  <h3>Aucun événement trouvé</h3>
  <p>Votre traiteur n'a pas encore associé d'événements à ce jeton d'accès.</p>
</div>

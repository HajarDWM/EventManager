<!-- Hero Header -->
<div class="d-flex flex-column flex-md-row justify-content-md-between align-items-md-center py-2 text-center text-md-start mb-4">
  <div class="flex-grow-1 mb-1 mb-md-0">
    <h1 class="h3 fw-bold mb-2">
      Modèle d'Invitation
    </h1>
    <h2 class="h6 fw-medium text-muted mb-0" *ngIf="event()">
      Aperçu en direct de l'invitation pour : <strong class="text-primary">{{ event()?.title }}</strong>
    </h2>
  </div>
  <div class="mt-3 mt-md-0 d-flex gap-2 justify-content-center">
    <a [routerLink]="['/client/dashboard']" class="btn btn-alt-secondary">
      <i class="fa fa-arrow-left me-1"></i> Retour au Tableau de Bord
    </a>
  </div>
</div>
<!-- END Hero Header -->

<div class="row justify-content-center" *ngIf="event()">
  <div class="col-md-10 col-lg-8">
    
    <!-- Info Alert -->
    <div class="alert alert-warning d-flex align-items-center gap-3 shadow-sm rounded-3 mb-4 border-0">
      <div class="flex-shrink-0">
        <i class="fa fa-eye fa-2x text-warning"></i>
      </div>
      <div class="flex-grow-1">
        <h4 class="alert-heading h6 fw-bold mb-1">Ceci est un aperçu</h4>
        <p class="mb-0 fs-sm">Voici exactement ce que vos invités verront lorsqu'ils ouvriront le lien d'invitation. Assurez-vous que toutes les informations sont correctes avant l'envoi officiel.</p>
      </div>
    </div>

    <!-- Embedded Guest RSVP Preview -->
    <div class="preview-container shadow-lg rounded-4 overflow-hidden position-relative bg-white" style="min-height: 80vh;">
      <app-guest-rsvp 
        *ngIf="rsvpPreviewData()" 
        [previewMode]="true" 
        [previewData]="rsvpPreviewData()">
      </app-guest-rsvp>
    </div>
  </div>
</div>

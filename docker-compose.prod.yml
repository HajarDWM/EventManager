services:
  # 1. Base de données MySQL 8.0 Sécurisée (UTF-8, Port 9512)
  event-db:
    image: mysql:8.0
    container_name: event-mysql-db
    restart: always
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --character-set-client-handshake=FALSE
    ports:
      - "9512:3306"
    environment:
      MYSQL_DATABASE: ${DB_NAME:-event_manager_db}
      MYSQL_USER: ${DB_USER:-event_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-SecretDbPass2026!}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-RootDbPass2026!}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - event-prod-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-RootDbPass2026!}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 2. Backend Spring Boot (API Java 21, Port 9511)
  event-backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile.prod
    container_name: event-backend
    restart: always
    ports:
      - "9511:8080"
    environment:
      DB_HOST: event-db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-event_manager_db}
      DB_USER: ${DB_USER:-event_user}
      DB_PASSWORD: ${DB_PASSWORD:-SecretDbPass2026!}
      SPRING_PROFILES_ACTIVE: prod
      JWT_SECRET: ${JWT_SECRET:-9a8b7c6d5e4f3a2b1c0d9e8f7a6b5c4d3e2f1a0b9c8d7e6f5a4b3c2d1e0f9a8b}
    depends_on:
      event-db:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads
    networks:
      - event-prod-network
    logging:
      driver: "json-file"
      options:
        max-size: "15m"
        max-file: "3"

  # 3. Frontend Angular & Nginx Reverse Proxy (Port 9510 - Point d'entrée principal)
  event-frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile.prod
    container_name: event-frontend
    restart: always
    ports:
      - "9510:80"
    volumes:
      - ./Frontend/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - uploads_data:/app/uploads:ro
    depends_on:
      - event-backend
    networks:
      - event-prod-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 4. phpMyAdmin (Administration visuelle BDD, Port 9513)
  event-phpmyadmin:
    image: phpmyadmin:5.2.1
    container_name: event-phpmyadmin
    restart: always
    ports:
      - "9513:80"
    environment:
      PMA_HOST: event-db
      PMA_PORT: 3306
      PMA_ARBITRARY: 0
      UPLOAD_LIMIT: 64M
    depends_on:
      - event-db
    networks:
      - event-prod-network
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  db_data:
    name: eventmanager_prod_db_data
  uploads_data:
    name: eventmanager_prod_uploads_data

networks:
  event-prod-network:
    name: eventmanager_prod_network
    driver: bridge

server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:event-mysql-db}:${DB_PORT:3306}/${DB_NAME:event_manager_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&autoReconnect=true&failOverReadOnly=false&characterEncoding=UTF-8&useUnicode=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:rootpassword}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 3
      connection-timeout: 30000
      idle-timeout: 300000
      max-lifetime: 1200000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    ignore-missing-migrations: true
    ignore-migration-patterns: "*:missing"
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 20MB
  web:
    resources:
      static-locations:
        - classpath:/static/
        - file:/app/uploads/

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  upload:
    menu-images-dir: /app/uploads/menu
    templates-dir: /app/uploads/templates

logging:
  level:
    root: INFO
    com.example.eventmanager: INFO

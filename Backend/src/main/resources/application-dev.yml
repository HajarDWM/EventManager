spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3307/event_manager_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&autoReconnect=true&failOverReadOnly=false
    username: root
    password: rootpassword
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    ignore-missing-migrations: true
    ignore-migration-patterns: "*:missing"
  servlet:
    multipart:
      enabled: true
      max-file-size: 2MB
      max-request-size: 5MB

# Upload directory (relative to project, served as static resource)
app:
  upload:
    menu-images-dir: src/main/resources/static/uploads/menu
